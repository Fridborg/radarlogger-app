name: Bygg Android-app

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true

      - name: Fast signeringsnyckel (så att nya versioner kan installeras ovanpå gamla)
        run: |
          mkdir -p ~/.android
          cp tool/signing/test.keystore ~/.android/debug.keystore

      - name: Skapa Android-projekt
        run: |
          flutter create --platforms=android --org se.radarskylt --project-name radarlogger .
          python3 tool/patch_android.py

      - name: Hämta paket
        run: flutter pub get

      - name: Kontrollera koden
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Bygg APK
        run: |
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/radarlogger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radarlogger-apk
          path: out/radarlogger.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radarlogger build ${{ github.run_number }}
          body: Ladda ner radarlogger.apk och installera på telefonen.
          files: out/radarlogger.apk
