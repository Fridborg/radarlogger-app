name: Bygg Android-app

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true

      - name: Skapa Android-projekt
        run: |
          flutter create --platforms=android --org se.radarskylt --project-name radarlogger .
          python3 tool/patch_android.py

      - name: Hämta paket
        run: flutter pub get

      - name: Kontrollera koden
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Bygg APK
        run: |
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/radarlogger.apk

      - name: Kontrollera att appen är signerad med den fasta nyckeln
        run: |
          keytool -printcert -jarfile out/radarlogger.apk | tee cert.txt
          grep -q "E7:73:8D:77:DC:47:ED:EE:8C:84:34:2A:8C:13:BC:B8:8B:5C:69:5E:8D:1C:0D:4B:8F:80:44:02:53:A8:9B:1B" cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: radarlogger-apk
          path: out/radarlogger.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radarlogger build ${{ github.run_number }}
          body: |
            radarlogger.apk – appen, installera på telefonen.
            radarlogger-x.y.z-ota.bin – ny firmware till radarloggern, laddas upp via http://192.168.4.1 (loggen finns kvar).
            radarlogger-x.y.z.bin – hel installation via USB med ESPHome Web (raderar loggen).
            radarsimulator-x.y.z.bin – låtsasradar till ESP nr 2, installeras via USB med ESPHome Web.
          files: |
            out/radarlogger.apk
            firmware/bin/radarlogger-*.bin
            firmware/bin/radarsimulator-*.bin
